# deploy/contzo/app.conf: how deploy.sh ships this project to the WSL host.
# Sourced by bash, so it is shell syntax: no spaces around '=', quote values.
# Committed to git; never put secrets here (they belong in ~/apps/lamplight/shared/.env).

APP_NAME="lamplight"              # ~/apps/lamplight, unit name, Caddy site file name
SUBDOMAIN="lamplight"             # -> https://lamplight.contzo.lol
KIND="service"                    # one Bun process behind Caddy (client bundle, API, WebSocket /ws)

# ---- service ---------------------------------------------------------------
PORT=7710                         # the unit sets HOST=127.0.0.1, so the app is reachable only through Caddy
HEALTH_PATH="/api/health"
# Bun comes from the nvm Node bin dir (installed there with npm), which the engine puts on PATH.
# Bun.serve bundles client/index.html itself at startup, so no prebuilt dist/ is needed.
PROCESSES=(
  "web|bun server/index.js"
)
SSE=0                             # WebSockets on /ws pass through Caddy's reverse_proxy as is
MAX_BODY=""
SHARED_DIRS=("data")              # SQLite lives in shared/data; the release's data/ links there
BACKUP="sqlite:data/lamplight.sqlite"
SYNC_EXCLUDES=("/dist/" "/legacy/" "/test/")

# ---- hooks ---------------------------------------------------------------------
app_build() {         # cwd: ~/apps/lamplight/src
  node_install        # bun install --frozen-lockfile; the "build" script (dist bundle) isn't used
}
app_env() {           # extra lines for the FIRST shared/.env (never rewritten later)
  echo "DB_PATH=data/lamplight.sqlite"
}
